<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>家計簿</title>
    <style>
        :root{
            --paper: #F2F3F0;
            --ink: #24303A;
            --income: #3E6B52;
            --expense: #9C4A3C;
            --line: #D7DAD2;
        }
        body{
            background: var(--paper);
            color: var(--ink);
            font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
            margin: 0;
            padding: 20px 16px 60px;
            max-width: 560px;
            margin-left: auto;
            margin-right: auto;
        }
        #tab-transactions, #tab-search, #tab-sumary, #tab-debts, #tab-history{
            display: none;
        }
        #tab-transactions.active, #tab-search.active, #tab-summary.active, #tab-debts.active, #tab-history.active{
            display: block;
        }
    </style>
</head>
<body>
    <h1>家計簿</h1>
    <p>Presonal Expense Tracker</p>
    <div class="tabs">
        <button type="button" onclick="showTab('transactions')">取引</button>
        <button type="button" onclick="showTab('search')">検索</button>
        <button type="button" onclick="showTab('summary')">サマリー</button>
        <button type="button" onclick="showTab('debts')">借金</button>
        <button type="button" onclick="showTab('history')">履歴</button>
    </div>
    <div id="tab-transactions">
     <!-- 取引の追加・編集フォーム -->
    <form id="txForm">
        <p id="formTitle">取引を追加</p>

        <label for="date">日付</label>
        <input type="date" id="date" required>
        
        <label for="type">タイプ</label>
        <select id="type">
            <option value="EXPENSE">支出</option>
            <option value="INCOME">収入</option>
        </select>

        <label for="category">カテゴリー</label>
        <select id="category">
            <option value="FOOD">食費</option>
            <option value="SALARY">給料</option>
        </select>

        <label for="amount">金額（円）</label>
        <input type="number" id="amount" min="1" required>

        <button type="submit" id="submitBtn">追加</button>
        <button type="button" onclick="cancelEdit()">キャンセル</button>
    </form>
    <!-- 取引一覧（JSで動的に生成される） -->
    <p>取引一覧</p>
    <ul id="txList"></ul>
    </div>
    <div id="tab-search">
    <!-- 取引の検索 -->
    <form id="searchForm">
        <p>取引を検索</p>
        <label for="searchCategory">カテゴリー</label>
        <select id="searchCategory">
            <option value="">すべて</option>
        </select>
        <label for="searchDate">日付</label>
        <input type="date" id="searchDate">
        <button type="submit">検索</button>
        <button type="button" onclick="resetSearch()">クリア</button>
    </form>
    </div>
    <div id="tab-summary">
    <!-- 収支サマリー（収入・支出・残高） -->
    <div>
        <span>収入合計: </span>
        <span id="totalIncome">-</span>
    </div>
    <div>
        <span>支出合計: </span>
        <span id="totalExpense">-</span>
    </div>
    <div>
        <span>残高: </span>
        <span id="balance">-</span>
    </div>
    <div>
        <span>貯金額: </span>
        <span id="savingsRate">-</span>
    </div>
    <!-- カテゴリー別統計 -->
    <h2>カテゴリー別統計</h2>
    <table>
        <thead>
            <tr>
                <th>カテゴリー</th>
                <th>金額</th>
                <th>割合</th>
            </tr>
        </thead>
        <tbody id="categoryStatsBody"></tbody>
    </table>
    <p id="mostUsedCategory"></p>
    </div>
    <div id="tab-debts">
    <!-- 借金管理 -->
    <h2>借金管理</h2>
    <div>
        <span>借金合計（残り）: </span>
        <span id="totalRemainingDebt">-</span>
    </div>
    <form id="debtForm">
        <label for="creditorName">借入先</label>
        <input type="text" id="creditorName" required>

        <label for="borrowedDate">借入日</label>
        <input type="date" id="borrowedDate" required>

        <label for="debtAmount">金額（円）</label>
        <input type="number" id="debtAmount" min="1" required>

        <button type="submit">借金を追加</button>
    </form>
    <p>借金一覧</p>
    <ul id="debtList"></ul>
    </div>
    <div id="tab-history">
        <p>返済履歴</p>
        <ul id="debtPaymentHistoryList"></ul>
    </div>
    <script>
        const API_URL = "/api/transactions";
        let allTransactions = [];
        let editingId = null;
        // タブを切り替える
        function showTab(tabName){
            const tabs = ["transactions", "search", "summary", "debts", "history"];
            for(const name of tabs){
                document.getElementById("tab-" + name).classList.remove("active");
            }
            document.getElementById("tab-" + tabName).classList.add("active");
        }
        showTab("transactions");
        // カテゴリー一覧（Category.javaのgetJapaneseName()と対応）
        const CATEGORIES = {
            INCOME:[
                ["SALARY", "給料"]
            ],
            EXPENSE:[
                ["FOOD", "食費"],
                ["ELECTRICITY", "電気代"],
                ["WATER", "水道代"],
                ["GAS", "ガス代"],
                ["INTERNET", "インターネット"],
                ["INSURANCE", "保険"],
                ["GYM", "ジム"],
                ["TRANSPORTATION", "交通費"],
                ["ENTERTAINMENT", "娯楽"],
                ["SHOPPING", "買い物"],
                ["OTHER", "その他"]
            ]
        };
        // カテゴリーのコード（例: "FOOD"）から日本語名（例: "食費"）を取得
        function getCategoryLabel(categoryValue){
            const allCategories = CATEGORIES.INCOME.concat(CATEGORIES.EXPENSE);
            for(const pair of allCategories){
                if(pair[0] === categoryValue){
                    return pair[1];
                }
            }
            return categoryValue;
        }
        // 金額を「¥1,000」の形式に整形
        function formatYen(amount){
            return "¥" + amount.toLocaleString("ja-JP");
        }
        // タイプに応じてカテゴリーの選択肢を更新
        function refreshCategoryOptions(){
            const type = document.getElementById("type").value;
            const list = CATEGORIES[type];
            let optionHtml ="";
            for(const pair of list){
                const value = pair[0];
                const label = pair[1];
                optionHtml = optionHtml + "<option value='" + value + "'>" + label + "</option>";
            }
            document.getElementById("category").innerHTML = optionHtml;
        }
        // 検索フォームのカテゴリー選択肢を設定（「すべて」+ 全カテゴリー）
        function fillSearchCategoryOptions(){
            const allCategories = CATEGORIES.INCOME.concat(CATEGORIES.EXPENSE);
            let optionHtml = "<option value=''>すべて</option>";
            for(const pair of allCategories){
                const value = pair[0];
                const label = pair[1];
                optionHtml = optionHtml + "<option value='" + value + "'>" + label + "</option>";
            }
            document.getElementById("searchCategory").innerHTML = optionHtml;
        }
        // カテゴリー別の支出を集計して表に表示
        function renderCategoryStats(transactions){
            const categoryTotals = {};
            let totalExpense = 0;
            for(const t of transactions){
                if(t.type === "EXPENSE"){
                    if(categoryTotals[t.category] === undefined){
                        categoryTotals[t.category] = 0;
                    }
                    categoryTotals[t.category] = categoryTotals[t.category] + t.amount;
                    totalExpense = totalExpense + t.amount;
                }
            }
            if(totalExpense === 0){
                document.getElementById("categoryStatsBody").innerHTML = 
                     "<tr><td colspan='3'>データがありません</td></tr>";
                document.getElementById("mostUsedCategory").textContent = "";
                return;
            }
            let rowsHtml = "";
            let mostUsedCategory = null;
            let maxAmount = 0;
            for(const category in categoryTotals){
                const amount = categoryTotals[category];
                const percentage = (amount / totalExpense * 100).toFixed(0);
                rowsHtml = rowsHtml + "<tr><td>" + getCategoryLabel(category) + "</td><td>" +
                    formatYen(amount) + "</td><td>" + percentage + "%</td></tr>";
                if(amount > maxAmount){
                    maxAmount = amount;
                    mostUsedCategory = category;
                }
            }
            document.getElementById("categoryStatsBody").innerHTML = rowsHtml;
            document.getElementById("mostUsedCategory").textContent = 
                "一番使ったカテゴリー: " + getCategoryLabel(mostUsedCategory);
        }
        // 取引一覧を画面に描画する（loadTransactionsとsearchTransactionsで共用）
        function renderTransactionList(transactions){
            // 取引一覧のHTMLを組み立てる（編集・削除ボタン付き）
            let listHtml ="";
            for(const t of transactions){
                let sign = "";
                if(t.type === "INCOME"){
                    sign = "+";
                }else{
                    sign = "-";
                }
                listHtml = listHtml + "<li>" + t.date + " " +getCategoryLabel(t.category) + " " + sign + formatYen(t.amount) + " " +
                    "<button onclick='startEdit(" + t.id +")'>編集</button>" +
                    "<button onclick='deleteTransaction(" + t.id + ")'>削除</button></li>";
            }
            document.getElementById("txList").innerHTML = listHtml;
        }
        // GET - 検索条件に応じて取引を絞り込む
        async function searchTransactions(){
            const category = document.getElementById("searchCategory").value;
            const date = document.getElementById("searchDate").value;
            let url = "/api/transactions/search?";
            if(category !== ""){
                url = url + "category=" + category + "&";
            }
            if(date !== ""){
                url = url + "date=" + date + "&";
            }
            const res = await fetch(url);
            const transactions = await res.json();
            renderTransactionList(transactions);
        }
        // 検索条件をクリアして、全ての取引を再表示
        function resetSearch(){
            document.getElementById("searchForm").reset();
            loadTransactions();
        }
        // GET - 取引一覧を取得して画面に表示
        async function loadTransactions() {
            const res = await fetch(API_URL);
            const transactions = await res.json();
            allTransactions = transactions;
            // サマリー（収入合計・支出合計・残高）を計算
            let income = 0;
            let expense = 0;
            for(const t of transactions){
                if(t.type === "INCOME"){
                    income = income + t.amount;
                }else{
                    expense = expense + t.amount;
                }
            }
            document.getElementById("totalIncome").textContent = formatYen(income);
            document.getElementById("totalExpense").textContent = formatYen(expense);
            document.getElementById("balance").textContent = formatYen(income - expense);
            if(income === 0){
                document.getElementById("savingsRate").textContent = "データがありません";
            }else{
                const savingsRate = (income - expense) / income * 100;
                document.getElementById("savingsRate").textContent = savingsRate.toFixed(0) + "%";
            }
            renderCategoryStats(transactions);
            renderTransactionList(transactions);
        }
        // 編集ボタン - フォームに既存データを反映
        function startEdit(id){
            editingId = id;
            const t = allTransactions.find(function(item){
                return item.id === id;
            });
            document.getElementById("date").value = t.date;
            document.getElementById("type").value = t.type;
            document.getElementById("category").value = t.category;
            document.getElementById("amount").value = t.amount;
            document.getElementById("formTitle").textContent = "取引を編集";
            document.getElementById("submitBtn").textContent = "更新";
        }
        // キャンセルボタン - 編集状態を解除し、フォームを初期状態に戻す
        function cancelEdit(){
            editingId = null;
            document.getElementById("txForm").reset();
            document.getElementById("formTitle").textContent = "取引を追加";
            document.getElementById("submitBtn").textContent = "追加";
        }
        // DELETE - 取引を削除
        async function deleteTransaction(id){
            const confirmed = confirm("この取引を削除しますか？");
            if(!confirmed){
                return;
            }
            await fetch(API_URL + "/" + id, {
                method: "DELETE"
            });
            loadTransactions();
        }
        document.getElementById("txForm").addEventListener("submit", async function (event){
            event.preventDefault();
            
            const date = document.getElementById("date").value;
            const type = document.getElementById("type").value;
            const category = document.getElementById("category").value;
            const amount = Number(document.getElementById("amount").value);
            
            const payload = {
                date: date,
                type: type,
                category: category,
                amount: amount
            };
            let res;
            if(editingId === null){
                res = await fetch(API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json"},
                    body: JSON.stringify(payload)
                });
            }else{
                res = await fetch(API_URL + "/" +editingId, {
                    method: "PUT",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });
            }
            if(!res.ok){
                const message = await res.text();
                alert(message);
                return;
            }
            editingId = null;
            document.getElementById("txForm").reset();
            loadTransactions();
        });
        document.getElementById("type").addEventListener("change", refreshCategoryOptions);
        refreshCategoryOptions();
        fillSearchCategoryOptions();
        document.getElementById("searchForm").addEventListener("submit", function(event){
            event.preventDefault();
            searchTransactions();
        });
        const DEBT_API_URL = "/api/debts";
        // GET - 借金一覧を取得して画面に表示
        async function loadDebts() {
            const res = await fetch(DEBT_API_URL);
            const debts = await res.json();

            let totalRemaining = 0;
            for(const d of debts){
                totalRemaining = totalRemaining + d.remainingAmount;
            }
            document.getElementById("totalRemainingDebt").textContent = formatYen(totalRemaining);

            let listHtml = "";
            for(const d of debts){
                let status = "";
                if(d.paid){
                    status = "返済済み";
                }else{
                    status = "返済中";
                }
                listHtml = listHtml + "<li>" + d.creditorName + " " + formatYen(d.amount) + " (残り" + formatYen(d.remainingAmount) + ", " + d.progressPercentage.toFixed(0) + "%, " + status + ") [借入日: " + d.borrowedDate + "] " +
                    "<button onclick ='payDebt(" + d.id + ", " + d.remainingAmount +")'>返済</button>" + 
                    "<button onclick='toggleHistory(" + d.id + ")'>履歴を見る</button>" +
                    "<button onclick='deleteDebt(" + d.id + ")'>削除</button>" +
                    "<div id='history-" + d.id + "' style='display:none;'></div>" +
                    "</li>"; 
            }
            document.getElementById("debtList").innerHTML = listHtml;
        }
        // 返済ボタン - 返済額を入力してAPIに送信
        async function payDebt(id, remaining){
            const input = prompt("返済額を入力してください（残り" + remaining + "円）：");
            if(input === null){
                return;
            }
            const payment = Number(input);
            const res = await fetch(DEBT_API_URL + "/" + id + "/payment", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ payment: payment })
            });
            if(!res.ok){
                const message = await res.text();
                alert(message);
                return;
            }
            loadDebts();
        }
        // DELETE - 借金を削除
        async function deleteDebt(id){
            const confirmed = confirm("この借金を削除しますか？返済履歴も削除されます。");
            if(!confirmed){
                return;
            }
            await fetch (DEBT_API_URL + "/" + id, {
                method: "DELETE"
            });
            loadDebts();
        }
        // 返済履歴の表示/非表示を切り替える（アコーディオン）
        async function toggleHistory(debtId) {
            const historyDiv = document.getElementById("history-" + debtId);
            if(historyDiv.style.display === "block"){
                historyDiv.style.display = "none";
                return;
            }
            const res = await fetch(DEBT_API_URL + "/" + debtId + "/payments");
            const payments = await res.json();

            let historyHtml = "";
            for(const p of payments){
                historyHtml = historyHtml + "<div>" + p.paymentDate + " " + formatYen(p.amount) + "</div>";
            }

            if(payments.length === 0){
                historyHtml = "<div>返済履歴がありません。</div>";
            }

            historyDiv.innerHTML = historyHtml;
            historyDiv.style.display = "block";
        }
        document.getElementById("debtForm").addEventListener("submit", async function (event) {
            event.preventDefault();
            
            const creditorName = document.getElementById("creditorName").value;
            const borrowedDate = document.getElementById("borrowedDate").value;
            const amount = Number(document.getElementById("debtAmount").value);

            const payload = {
                creditorName: creditorName,
                amount: amount,
                borrowedDate: borrowedDate
            };

            const res = await fetch(DEBT_API_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });
            if(!res.ok){
                const message = await res.text();
                alert(message);
                return;
            }
            
            document.getElementById("debtForm").reset();
            loadDebts();
        });
        loadTransactions();
        loadDebts();
    </script>
</body>

</html>
